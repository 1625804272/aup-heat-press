<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AUP 熨斗机 · 特采报价计算器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Noto+Sans:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css?v=20260805" />
</head>
<body>
  <header class="nav" id="nav">
    <div class="nav-inner">
      <a class="brand" href="index.html" aria-label="AUP 首页" data-i18n-attr="aria-label:aria_brand_home">
        <span class="brand-mark">A</span>
        <span class="brand-text">AUP<i data-i18n="hero_brand">熨斗机</i></span>
      </a>
      <nav class="nav-links" id="navLinks">
        <a href="index.html#catalog" data-i18n="nav_catalog">全部机型</a>
        <a href="index.html#stock" data-i18n="nav_stock">实时库存</a>
        <a href="index.html#returns" data-i18n="nav_returns">退货台账</a>
        <a href="rules.html" data-i18n="nav_rules">特采规则</a>
        <a href="calc.html" data-i18n="nav_calc">报价计算器</a>
      </nav>
      <div class="lang-switch" id="langSwitch"></div>
      <button class="nav-toggle" id="navToggle" aria-label="菜单" data-i18n-attr="aria-label:aria_menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main class="detail-page">
    <section class="section section-alt">
      <div class="section-head">
        <span class="kicker">QUOTE CALCULATOR</span>
        <h2 data-i18n="calc_h2">特采报价计算器</h2>
        <p data-i18n="calc_p">输入单笔订单金额，自动匹配适用折扣率与折后参考金额。</p>
      </div>
      <div class="calc-card">
        <div class="calc-input">
          <label for="orderAmount" data-i18n="calc_label">单笔订单金额（元）</label>
          <div class="amount-field">
            <span class="cny">¥</span>
            <input type="number" id="orderAmount" min="0" step="1000" placeholder="例如 120000" data-i18n-attr="placeholder:calc_placeholder" />
          </div>
          <input type="range" id="orderRange" min="0" max="400000" step="1000" value="120000" />
          <div class="range-scale"><span>0</span><span data-i18n="range_80k">8万</span><span data-i18n="range_200k">20万</span><span data-i18n="range_350k">35万</span><span data-i18n="range_400k">40万+</span></div>
          <p class="calc-hint" data-i18n="calc_hint">提示：金额按「含港杂运费」的整笔订单核算；多部门拼货时运费按比例分摊，不可集中计入某一部门以套取折扣。</p>
        </div>
        <div class="calc-result" id="calcResult"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <span class="brand-mark">A</span>
        <div>
          <b data-i18n="footer_brand">AUP 熨斗机</b>
          <p data-i18n="footer_sub">热转印压烫设备 · 产品与结算价手册</p>
        </div>
      </div>
      <p class="footer-src" data-i18n="footer_src">数据来源：2026熨斗结算价（2026.7.22）业务技术专用。本页价格为业务参考，最终以正式合同为准。</p>
      <a class="footer-admin" href="admin.html" title="后台管理" data-i18n="footer_admin" data-i18n-attr="title:admin_title">后台管理</a>
    </div>
  </footer>

  <script src="assets/js/i18n.js?v=20260805"></script>
  <script src="assets/js/calc.js?v=20260805"></script>
</body>
</html>
